---
# Module 4, Step 2: the Controller credential that injects Satellite admin
# credentials into the remediation Job Template, so the EDA rulebook never
# has to know them.
#
# Idempotent by design (state: present on both objects), the same property
# the "look it up by name, create if missing" shell in the other two /root
# helper scripts provides. Safe to re-run in the participant's terminal.
- name: Create the Satellite API credential in Controller
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    # Same literal as AAP_ADMIN_PASSWORD in setup-aap1.sh - see the comment
    # there; this file is one of the places it is hardcoded.
    aap_admin_password: bc31c9a6-9ff0-11ec-9587-00155d1b0702
    satellite_admin_username: admin
    satellite_admin_password: bc31c9a6-9ff0-11ec-9587-00155d1b0702
  module_defaults:
    group/ansible.controller.controller:
      controller_host: https://localhost
      controller_username: admin
      controller_password: "{{ aap_admin_password }}"
      validate_certs: false
  tasks:
    - name: Define the Satellite API credential type
      ansible.controller.credential_type:
        name: Satellite API Credentials
        kind: cloud
        inputs:
          fields:
            - id: username
              type: string
              label: Username
            - id: password
              type: string
              label: Password
              secret: true
          required:
            - username
            - password
        # !unsafe is required, not cosmetic. These are Controller's own
        # injector templates, resolved by Controller at job launch time.
        # Without it Ansible resolves them here instead, and the task fails
        # on an undefined 'username'/'password'.
        injectors:
          extra_vars:
            satellite_username: !unsafe '{{ username }}'
          env:
            SATELLITE_PASSWORD: !unsafe '{{ password }}'
        state: present

    - name: Create the Satellite admin credential
      ansible.controller.credential:
        name: Satellite Admin (API)
        organization: Default
        credential_type: Satellite API Credentials
        inputs:
          username: "{{ satellite_admin_username }}"
          password: "{{ satellite_admin_password }}"
        state: present

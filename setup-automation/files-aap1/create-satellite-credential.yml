---
# Module 4, Step 2: the Controller credential that injects Satellite admin
# credentials into the remediation Job Template, so the EDA rulebook never
# has to know them.
#
# Controller's REST API is called through ansible.builtin.uri rather than the
# ansible.controller collection, for the same reason the satellite-side
# playbooks avoid theforeman.foreman: the collection is not guaranteed to be
# installed where the playbook runs, and ansible-core is. On aap1.lab it is in
# fact absent - ansible.controller ships inside AAP's execution environment
# images, not on the control node's filesystem - and a
# `group/ansible.controller.controller` module_defaults block fails at parse
# time, before a single task runs:
#
#   ERROR! Error loading module_defaults: could not resolve the
#   module_defaults group ansible.controller.controller
#
# Nothing here needs more than ansible.builtin.
#
# Idempotent: each object is looked up by name, then POSTed if absent or
# PATCHed in place if present. Safe to re-run in the participant's terminal.
- name: Create the Satellite API credential in Controller
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    # Same literal as AAP_ADMIN_PASSWORD in setup-aap1.sh - see the comment
    # there; this file is one of the places it is hardcoded.
    aap_admin_password: bc31c9a6-9ff0-11ec-9587-00155d1b0702
    satellite_admin_username: admin
    satellite_admin_password: bc31c9a6-9ff0-11ec-9587-00155d1b0702
    controller_api: https://localhost/api/controller/v2
    credential_type_name: Satellite API Credentials
    credential_name: Satellite Admin (API)
    organization_name: Default
  module_defaults:
    ansible.builtin.uri:
      url_username: admin
      url_password: "{{ aap_admin_password }}"
      force_basic_auth: true
      validate_certs: false
      body_format: json
  tasks:
    # Names are matched with Controller's ?name= exact filter rather than
    # ?search=, which is a substring match and would also return, say, the
    # built-in "Red Hat Satellite 6" type. urlencode because every name here
    # contains spaces, and "Satellite Admin (API)" contains parentheses too.
    - name: Look up the Satellite API credential type
      ansible.builtin.uri:
        url: "{{ controller_api }}/credential_types/?name={{ credential_type_name | urlencode }}"
      register: r_cred_type

    # The inputs/injectors literals are written out in full in both the POST
    # and the PATCH rather than hoisted into a var, so nothing here depends on
    # Ansible round-tripping a dict through its string representation.
    #
    # !unsafe is required, not cosmetic. These are Controller's own injector
    # templates, resolved by Controller at job launch time. Without it Ansible
    # resolves them here instead, and the task fails on an undefined
    # 'username'/'password'.
    - name: Create it
      when: r_cred_type.json.count == 0
      ansible.builtin.uri:
        url: "{{ controller_api }}/credential_types/"
        method: POST
        body:
          name: "{{ credential_type_name }}"
          kind: cloud
          inputs:
            fields:
              - id: username
                type: string
                label: Username
              - id: password
                type: string
                label: Password
                secret: true
            required:
              - username
              - password
          injectors:
            extra_vars:
              satellite_username: !unsafe '{{ username }}'
            env:
              SATELLITE_PASSWORD: !unsafe '{{ password }}'
        status_code: [200, 201]
      register: r_cred_type_created

    # Re-running this step is safe: an existing type is converged in place
    # instead of failing the way a bare POST does on a duplicate name.
    - name: Update it in place if it is already there
      when: r_cred_type.json.count > 0
      ansible.builtin.uri:
        url: "{{ controller_api }}/credential_types/{{ r_cred_type.json.results[0].id }}/"
        method: PATCH
        body:
          inputs:
            fields:
              - id: username
                type: string
                label: Username
              - id: password
                type: string
                label: Password
                secret: true
            required:
              - username
              - password
          injectors:
            extra_vars:
              satellite_username: !unsafe '{{ username }}'
            env:
              SATELLITE_PASSWORD: !unsafe '{{ password }}'
        status_code: [200]

    - name: Settle on the credential type id either way
      ansible.builtin.set_fact:
        credential_type_id: >-
          {{ r_cred_type.json.results[0].id
             if r_cred_type.json.count > 0
             else r_cred_type_created.json.id }}

    # Unlike the ansible.controller modules, the REST API takes ids rather
    # than names for these two foreign keys, so both have to be resolved.
    - name: Look up the organization
      ansible.builtin.uri:
        url: "{{ controller_api }}/organizations/?name={{ organization_name | urlencode }}"
      register: r_org

    - name: Fail clearly if it is not there
      ansible.builtin.assert:
        that: r_org.json.count > 0
        fail_msg: >-
          No Controller organization named "{{ organization_name }}". It is
          created during provisioning by setup-automation/setup-aap1.sh.

    - name: Look up the Satellite admin credential
      ansible.builtin.uri:
        url: "{{ controller_api }}/credentials/?name={{ credential_name | urlencode }}"
      register: r_cred

    - name: Create it
      when: r_cred.json.count == 0
      ansible.builtin.uri:
        url: "{{ controller_api }}/credentials/"
        method: POST
        body:
          name: "{{ credential_name }}"
          organization: "{{ r_org.json.results[0].id }}"
          credential_type: "{{ credential_type_id }}"
          inputs:
            username: "{{ satellite_admin_username }}"
            password: "{{ satellite_admin_password }}"
        status_code: [200, 201]

    # Only the secret inputs are PATCHed. Re-pointing an existing credential
    # at a different credential_type is rejected by Controller, and converging
    # the password is the part that actually matters on a re-run.
    - name: Update its inputs in place if it is already there
      when: r_cred.json.count > 0
      ansible.builtin.uri:
        url: "{{ controller_api }}/credentials/{{ r_cred.json.results[0].id }}/"
        method: PATCH
        body:
          inputs:
            username: "{{ satellite_admin_username }}"
            password: "{{ satellite_admin_password }}"
        status_code: [200]

---
# Module 4, Step 3: the Controller Project that pulls the self-hosted
# vulnerability-remediation repo, and the Job Template that runs its
# find_and_remediate.yml.
#
# Controller's REST API is called through ansible.builtin.uri rather than the
# ansible.controller collection. See the header of create-satellite-credential.yml
# for why: the collection is not installed on aap1.lab's control node, and a
# `group/ansible.controller.controller` module_defaults block fails at parse
# time before any task runs.
#
# Idempotent: every object is looked up by name, then POSTed if absent or
# PATCHed in place if present, so a re-run converges rather than failing on a
# duplicate name.
- name: Create the Controller Project and Job Template
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    # Same literal as AAP_ADMIN_PASSWORD in setup-aap1.sh - see the comment
    # there; this file is one of the places it is hardcoded.
    aap_admin_password: bc31c9a6-9ff0-11ec-9587-00155d1b0702
    controller_api: https://localhost/api/controller/v2
    organization_name: Default
    scm_credential_name: Self-hosted repo deploy key (Controller)
    machine_credential_name: Managed Hosts SSH
    project_name: Vulnerability Package Finder
    job_template_name: Vulnerability Package Finder and Remediator
    execution_environment_name: Vulnerability Finder EE
    satellite_credential_name: Satellite Admin (API)
    # Controller's Project sync runs inside an Execution Environment
    # container that this containerized/rootless AAP launches via aap1-user's
    # podman with slirp4netns networking (see DEFAULT_CONTAINER_RUN_OPTIONS in
    # controller/etc/settings.py). From inside that container the ONLY way to
    # reach this host's sshd - where the self-hosted git repo lives - is
    # podman's "host.containers.internal" alias, and only because setup-aap1.sh
    # added allow_host_loopback=true to those slirp4netns options. Neither the
    # host's real IP (10.0.2.x, which collides with slirp4netns's own subnet ->
    # "Network is unreachable") nor podman's bridge gateway (10.88.0.1, unused
    # by these rootless slirp4netns containers -> "Connection refused") work
    # here. The EDA Project created during setup legitimately uses "localhost"
    # because EDA's own Project sync does not run inside such a container.
    git_host: host.containers.internal
    scm_url: "ssh://aap1-user@{{ git_host }}/home/aap1-user/git/vulnerability-remediation.git"
  module_defaults:
    ansible.builtin.uri:
      url_username: admin
      url_password: "{{ aap_admin_password }}"
      force_basic_auth: true
      validate_certs: false
      body_format: json
  tasks:
    # The REST API takes ids rather than names for every foreign key, so the
    # lookups the ansible.controller modules did implicitly are explicit here.
    - name: Look up the organization
      ansible.builtin.uri:
        url: "{{ controller_api }}/organizations/?name={{ organization_name | urlencode }}"
      register: r_org

    - name: Look up the built-in Source Control and Machine credential types
      ansible.builtin.uri:
        url: "{{ controller_api }}/credential_types/?name={{ item | urlencode }}"
      loop:
        - Source Control
        - Machine
      register: r_builtin_types

    - name: Fail clearly if the lab's base objects are missing
      ansible.builtin.assert:
        that:
          - r_org.json.count > 0
          - r_builtin_types.results | map(attribute='json.count') | min > 0
        fail_msg: >-
          Controller is missing its "{{ organization_name }}" organization or
          its built-in credential types. Provisioning
          (setup-automation/setup-aap1.sh) did not complete.

    - name: Name the two built-in credential type ids
      ansible.builtin.set_fact:
        scm_credential_type_id: "{{ r_builtin_types.results[0].json.results[0].id }}"
        machine_credential_type_id: "{{ r_builtin_types.results[1].json.results[0].id }}"
        organization_id: "{{ r_org.json.results[0].id }}"

    # Reuse the SAME deploy key from Module 3 as the SCM credential. This
    # playbook runs as root, so the key is read directly - the curl version
    # only shelled out to aap1-user to expand the ~ in the path.
    - name: Look up the SCM credential
      ansible.builtin.uri:
        url: "{{ controller_api }}/credentials/?name={{ scm_credential_name | urlencode }}"
      register: r_scm_cred

    - name: Reuse Module 3's deploy key as the SCM credential
      when: r_scm_cred.json.count == 0
      ansible.builtin.uri:
        url: "{{ controller_api }}/credentials/"
        method: POST
        body:
          name: "{{ scm_credential_name }}"
          organization: "{{ organization_id }}"
          credential_type: "{{ scm_credential_type_id }}"
          inputs:
            ssh_key_data: "{{ lookup('ansible.builtin.file', '/home/aap1-user/.ssh/eda_project_deploy_key') }}"
        status_code: [200, 201]
      register: r_scm_cred_created

    - name: Refresh its key in place if it is already there
      when: r_scm_cred.json.count > 0
      ansible.builtin.uri:
        url: "{{ controller_api }}/credentials/{{ r_scm_cred.json.results[0].id }}/"
        method: PATCH
        body:
          inputs:
            ssh_key_data: "{{ lookup('ansible.builtin.file', '/home/aap1-user/.ssh/eda_project_deploy_key') }}"
        status_code: [200]

    - name: Settle on the SCM credential id either way
      ansible.builtin.set_fact:
        scm_credential_id: >-
          {{ r_scm_cred.json.results[0].id
             if r_scm_cred.json.count > 0
             else r_scm_cred_created.json.id }}

    # The remediation playbook's second play (install the fixed RPMs) runs
    # ON the affected host over SSH with become, so the Job Template needs a
    # Machine credential - without one the EE cannot connect and every host
    # fails with "Permission denied (publickey)". Reuse the lab's own SSH key
    # (the IdentityFile root already uses to reach every managed host, per
    # /root/.ssh/config) as that credential, connecting as root.
    #
    # Kept as shell deliberately: expressing "first IdentityFile in the
    # config, else any .pem" natively takes a slurp, a regex, a stat and a
    # find, which is harder to follow than the two lines it replaces.
    - name: Locate the lab SSH key that reaches every managed host
      ansible.builtin.shell:
        cmd: |
          set -e
          KEY=$(awk '/IdentityFile/{print $2; exit}' /root/.ssh/config | sed "s|^~|$HOME|")
          [ -f "$KEY" ] || KEY=$(ls /root/.ssh/*.pem 2>/dev/null | head -1)
          echo "$KEY"
      register: r_lab_ssh_key
      changed_when: false

    - name: Fail early if no usable SSH key was found
      ansible.builtin.assert:
        that:
          - r_lab_ssh_key.stdout | trim | length > 0
        fail_msg: >-
          No IdentityFile in /root/.ssh/config and no /root/.ssh/*.pem - the
          Job Template would be created without a Machine credential and every
          host would fail with "Permission denied (publickey)".

    - name: Look up the Machine credential
      ansible.builtin.uri:
        url: "{{ controller_api }}/credentials/?name={{ machine_credential_name | urlencode }}"
      register: r_machine_cred

    - name: Create the Machine credential for the install play
      when: r_machine_cred.json.count == 0
      ansible.builtin.uri:
        url: "{{ controller_api }}/credentials/"
        method: POST
        body:
          name: "{{ machine_credential_name }}"
          organization: "{{ organization_id }}"
          credential_type: "{{ machine_credential_type_id }}"
          inputs:
            username: root
            ssh_key_data: "{{ lookup('ansible.builtin.file', r_lab_ssh_key.stdout | trim) }}"
        status_code: [200, 201]
      register: r_machine_cred_created

    - name: Refresh its key in place if it is already there
      when: r_machine_cred.json.count > 0
      ansible.builtin.uri:
        url: "{{ controller_api }}/credentials/{{ r_machine_cred.json.results[0].id }}/"
        method: PATCH
        body:
          inputs:
            username: root
            ssh_key_data: "{{ lookup('ansible.builtin.file', r_lab_ssh_key.stdout | trim) }}"
        status_code: [200]

    - name: Settle on the Machine credential id either way
      ansible.builtin.set_fact:
        machine_credential_id: >-
          {{ r_machine_cred.json.results[0].id
             if r_machine_cred.json.count > 0
             else r_machine_cred_created.json.id }}

    - name: Look up the Controller Project
      ansible.builtin.uri:
        url: "{{ controller_api }}/projects/?name={{ project_name | urlencode }}"
      register: r_project

    - name: Create the Controller Project
      when: r_project.json.count == 0
      ansible.builtin.uri:
        url: "{{ controller_api }}/projects/"
        method: POST
        body:
          name: "{{ project_name }}"
          organization: "{{ organization_id }}"
          scm_type: git
          scm_url: "{{ scm_url }}"
          credential: "{{ scm_credential_id }}"
        status_code: [200, 201]
      register: r_project_created

    # The PATCH also self-heals: an already-existing project (e.g. from an
    # earlier attempt) carrying a stale, unreachable scm_url is converged back
    # to the correct value and SCM credential.
    - name: Repair it in place if it is already there
      when: r_project.json.count > 0
      ansible.builtin.uri:
        url: "{{ controller_api }}/projects/{{ r_project.json.results[0].id }}/"
        method: PATCH
        body:
          scm_type: git
          scm_url: "{{ scm_url }}"
          credential: "{{ scm_credential_id }}"
        status_code: [200]

    - name: Settle on the project id either way
      ansible.builtin.set_fact:
        project_id: >-
          {{ r_project.json.results[0].id
             if r_project.json.count > 0
             else r_project_created.json.id }}

    # POST .../update/ starts a sync and returns the project_update that
    # tracks it; the wait the ansible.controller.project_update module did
    # internally is the until loop below.
    - name: Sync the project
      ansible.builtin.uri:
        url: "{{ controller_api }}/projects/{{ project_id }}/update/"
        method: POST
        status_code: [200, 201, 202]
      register: r_sync

    - name: Wait for the sync to finish
      ansible.builtin.uri:
        url: "{{ controller_api }}/project_updates/{{ r_sync.json.id }}/"
      register: r_sync_status
      until: r_sync_status.json.status not in ['new', 'pending', 'waiting', 'running']
      retries: 60
      delay: 2

    - name: Fail with the sync's own status if it did not succeed
      ansible.builtin.assert:
        that: r_sync_status.json.status == 'successful'
        fail_msg: >-
          Project sync finished as "{{ r_sync_status.json.status }}". The
          usual cause is Controller's Execution Environment container being
          unable to reach {{ git_host }} - see the comment on git_host above.
          Full output: {{ controller_api }}/project_updates/{{ r_sync.json.id }}/stdout/

    # Reuse an existing inventory - our playbook targets localhost for the
    # scan, then dynamically adds the affected hosts via add_host, so it
    # doesn't matter which inventory is attached.
    - name: Pick whichever inventory already exists
      ansible.builtin.uri:
        url: "{{ controller_api }}/inventories/?page_size=1"
      register: r_inventory

    - name: Look up the custom Execution Environment
      ansible.builtin.uri:
        url: "{{ controller_api }}/execution_environments/?name={{ execution_environment_name | urlencode }}"
      register: r_ee

    - name: Fail clearly if either is missing
      ansible.builtin.assert:
        that:
          - r_inventory.json.count > 0
          - r_ee.json.count > 0
        fail_msg: >-
          Controller has no inventory, or no "{{ execution_environment_name }}"
          Execution Environment. The EE is built and registered during
          provisioning by setup-automation/setup-aap1.sh.

    - name: Look up the Job Template
      ansible.builtin.uri:
        url: "{{ controller_api }}/job_templates/?name={{ job_template_name | urlencode }}"
      register: r_jt

    # ask_variables_on_launch is required. It allows the EDA rulebook to pass
    # host_name (the host that fired the webhook) as an extra var when it
    # launches this job template. Without it, Controller ignores any extra
    # vars supplied at launch time.
    - name: Create the Job Template that runs find_and_remediate.yml
      when: r_jt.json.count == 0
      ansible.builtin.uri:
        url: "{{ controller_api }}/job_templates/"
        method: POST
        body:
          name: "{{ job_template_name }}"
          job_type: run
          organization: "{{ organization_id }}"
          inventory: "{{ r_inventory.json.results[0].id }}"
          project: "{{ project_id }}"
          playbook: find_and_remediate.yml
          execution_environment: "{{ r_ee.json.results[0].id }}"
          ask_variables_on_launch: true
        status_code: [200, 201]
      register: r_jt_created

    - name: Converge it in place if it is already there
      when: r_jt.json.count > 0
      ansible.builtin.uri:
        url: "{{ controller_api }}/job_templates/{{ r_jt.json.results[0].id }}/"
        method: PATCH
        body:
          inventory: "{{ r_inventory.json.results[0].id }}"
          project: "{{ project_id }}"
          playbook: find_and_remediate.yml
          execution_environment: "{{ r_ee.json.results[0].id }}"
          ask_variables_on_launch: true
        status_code: [200]

    - name: Settle on the job template id either way
      ansible.builtin.set_fact:
        job_template_id: >-
          {{ r_jt.json.results[0].id
             if r_jt.json.count > 0
             else r_jt_created.json.id }}

    - name: Look up the Satellite API credential from Step 2
      ansible.builtin.uri:
        url: "{{ controller_api }}/credentials/?name={{ satellite_credential_name | urlencode }}"
      register: r_sat_cred

    - name: Fail clearly if Step 2 has not been run
      ansible.builtin.assert:
        that: r_sat_cred.json.count > 0
        fail_msg: >-
          No "{{ satellite_credential_name }}" credential in Controller. Run
          Module 4 Step 2 (/root/create-satellite-credential.yml) first.

    # Attach BOTH credentials: the Satellite API cred (for the scan play on
    # localhost) and the Machine cred (for the install play over SSH on each
    # affected host). A Job Template can hold one of each type.
    #
    # Unlike the ansible.controller.job_template module, the REST API does not
    # take credentials inline on the job template itself - they are associated
    # through this sub-endpoint, which no-ops on an already-attached id.
    - name: Attach the Satellite API and Machine credentials
      ansible.builtin.uri:
        url: "{{ controller_api }}/job_templates/{{ job_template_id }}/credentials/"
        method: POST
        body:
          id: "{{ item }}"
        status_code: [201, 204]
      loop:
        - "{{ r_sat_cred.json.results[0].id }}"
        - "{{ machine_credential_id }}"

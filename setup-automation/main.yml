---
- name: Create inventory
  hosts: localhost
  gather_facts: false
  tasks:
  - name: Add bastion host
    ansible.builtin.add_host:
      name: "{{ lookup('ansible.builtin.env', 'BASTION_HOST') }}"
      ansible_ssh_host: "{{ lookup('ansible.builtin.env', 'BASTION_HOST') }}"
      ansible_ssh_port: "{{ lookup('ansible.builtin.env', 'BASTION_PORT') }}"
      ansible_ssh_user: "{{ lookup('ansible.builtin.env', 'BASTION_USER') }}"
      ansible_ssh_pass: "{{ lookup('ansible.builtin.env', 'BASTION_PASSWORD') }}"
  - name: Add nodes
    ansible.builtin.add_host:
      name: "{{ item }}"
      ansible_ssh_host: "{{ item }}"
      ansible_ssh_port: "{{ lookup('ansible.builtin.env', 'BASTION_PORT') }}"
      ansible_ssh_user: "{{ lookup('ansible.builtin.env', 'BASTION_USER') }}"
      ansible_ssh_pass: "{{ lookup('ansible.builtin.env', 'BASTION_PASSWORD') }}"
      ansible_python_interpreter: /usr/libexec/platform-python
    loop:
      - aap1
      - rhel1
      - rhel2

- name: Demo Playbook for the ansible-runner API
  hosts: all:!localhost
  gather_facts: false
  vars:
    _showroom_env_guid: "{{ lookup('ansible.builtin.env', 'GUID') | default('') }}"
    _showroom_env_domain: "{{ lookup('ansible.builtin.env', 'DOMAIN') | default('') }}"
    _showroom_env_litellm_url: "{{ lookup('ansible.builtin.env', 'LITELLM_API_URL') | default('') }}"
    _showroom_env_litellm_key: "{{ lookup('ansible.builtin.env', 'LITELLM_API_KEY') | default('') }}"
    _showroom_env_registry_pull_token: "{{ lookup('ansible.builtin.env', 'REGISTRY_PULL_TOKEN') | default('') }}"
  tasks:
    - ansible.builtin.wait_for_connection:

    - name: Simple debug task
      ansible.builtin.debug:
        msg: "Hello Runner"

    - name: Set config_host variable with ansible_host value
      ansible.builtin.set_fact:
        config_host: "{{ ansible_host }}"

    - name: Create a directory if it does not exist
      ansible.builtin.file:
        path: "/tmp/setup-scripts/"
        state: directory
        mode: '0755'
    - name: Create a directory if it does not exist
      ansible.builtin.file:
        path: "/tmp/setup-scripts/"
        state: directory
        mode: '0755'

    - name: Check if setup-server.sh exists
      ansible.builtin.stat:
        path: "./setup-{{ config_host }}.sh"
      delegate_to: localhost
      register: r_script_test
    - name: Check if setup-server.sh exists
      ansible.builtin.stat:
        path: "./setup-{{ config_host }}.sh"
      delegate_to: localhost
      register: r_script_test

    - name: Copy script file
      when: r_script_test.stat.exists
      ansible.builtin.copy:
        src: "./setup-{{ ansible_host }}.sh"
        dest: "/tmp/setup-scripts/setup-{{ ansible_host }}.sh"
      register: r_result

    - name: Check if a payload directory exists for this host
      ansible.builtin.stat:
        path: "./files-{{ config_host }}"
      delegate_to: localhost
      register: r_payload_test

    # Created explicitly so the copy below creates no directories at all.
    # That keeps mode applying only to the files, with no directory_mode
    # ambiguity.
    - name: Create the payload directory on the target
      when: r_payload_test.stat.exists and r_payload_test.stat.isdir
      ansible.builtin.file:
        path: "/tmp/setup-scripts/files-{{ ansible_host }}/"
        state: directory
        mode: '0755'

    # The trailing slash on src copies the directory contents, not the
    # directory itself. mode 0644 is required, not cosmetic: this task has
    # no become, so it runs as the bastion SSH user, and without an
    # explicit mode the files inherit that account's umask. A 0077 umask
    # would leave them unreadable to aap1-user, who consumes three of them.
    - name: Copy payload files
      when: r_payload_test.stat.exists and r_payload_test.stat.isdir
      ansible.builtin.copy:
        src: "./files-{{ ansible_host }}/"
        dest: "/tmp/setup-scripts/files-{{ ansible_host }}/"
        mode: '0644'
        directory_mode: '0755'

    - name: Execute module_stage-host.sh if it exists
      when: r_script_test.stat.exists
      ansible.builtin.shell: "sh -x /tmp/setup-scripts/setup-{{ ansible_host }}.sh > /tmp/setup-scripts/setup-{{ ansible_host }}.log 2>&1"
      become: true
      environment:
        GUID: "{{ _showroom_env_guid }}"
        DOMAIN: "{{ _showroom_env_domain }}"
        LITELLM_API_URL: "{{ _showroom_env_litellm_url }}"
        LITELLM_API_KEY: "{{ _showroom_env_litellm_key }}"
        REGISTRY_PULL_TOKEN: "{{ _showroom_env_registry_pull_token }}"
      register: r_result

    - name: Output script result
      ansible.builtin.debug:
        var: r_result.stdout
      when: r_script_test.stat.exists
    - name: Output script result
      ansible.builtin.debug:
        var: r_result.stdout
      when: r_script_test.stat.exists

    - name: Write script result to file
      ansible.builtin.copy:
        content: "{{ r_result.stdout | default(r_result.stderr) | default(r_result) }}"
        dest: "/tmp/{{ ansible_host }}-setup-script.out"
      delegate_to: localhost
      when:
        - r_result is defined

    - name: Output script result
      ansible.builtin.debug:
        var: r_result
      when: r_result is defined
    - name: Output script result
      ansible.builtin.debug:
        var: r_result
      when: r_result is defined

  - name: "aap1"
    image: "aap1-091726-2"
    bootloader: efi
    register_satellite: false
    memory: "16G"
    cores: 8
    image_size: "200Gi"
    tags:
      - key: "AnsibleGroup"
        value: "nodes"
    networks:
      - default
    userdata: |
      #cloud-config
      fqdn: aap1.lab
      hostname: aap1
      prefer_fqdn_over_hostname: true
      manage_etc_hosts: true
    services:
      - name: aap1-https
        ports:
          - port: 443
            protocol: TCP
            targetPort: 443
            name: aap1-https
    routes:
      - name: aap1-https
        host: aap1
        service: aap1-https
        targetPort: 443
        tls: true
        tls_termination: reencrypt
        # AAP's gateway (envoy) terminates its own TLS on :443 with a
        # self-signed cert issued by the AAP-generated CA below, so the
        # route must reencrypt (edge -> plain-HTTP to backend causes a
        # 502; reencrypt without this CA causes a 503 from the router,
        # since it won't trust the self-signed cert by default).
        # NOTE: this CA is regenerated by the AAP installer any time it
        # (re-)runs `ansible.containerized_installer.install` on a fresh
        # image build, so it must be re-extracted (`cat aap/tls/ca.cert`
        # as aap-user on the VM) and this value updated whenever the
        # aap1-* golden image is rebuilt. See docs/aap1-golden-image-fixes.md.
